name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # The secrets are not available in the condition of a job, they live in
    # the environment of the job and the steps look at them.
    env:
      VDS_SSH_KEY: ${{ secrets.VDS_SSH_KEY }}
      VDS_KNOWN_HOSTS: ${{ secrets.VDS_KNOWN_HOSTS }}
      VDS_HOST: ${{ secrets.VDS_HOST }}
      VDS_PATH: ${{ secrets.VDS_PATH }}
    steps:
      - uses: actions/checkout@v4

      - name: The keys of the deployment
        if: env.VDS_SSH_KEY == ''
        run: |
          echo "the deployment is skipped, there is no key of the server"

      - name: Set up the ssh key
        if: env.VDS_SSH_KEY != ''
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VDS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VDS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy to the server
        if: env.VDS_SSH_KEY != ''
        run: |
          ssh -i ~/.ssh/id_ed25519 "root@$VDS_HOST" "cd $VDS_PATH && bash deploy/deploy.sh"
