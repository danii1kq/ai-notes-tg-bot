name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: The tag of the release, for example v0.1.0
        required: true

permissions:
  contents: write
  packages: write

jobs:
  image:
    name: The image in the registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up the buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: The tags of the image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: The release on GitHub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The notes of the release
        id: notes
        run: |
          VERSION="${{ inputs.tag || github.ref_name }}"
          {
            echo "## The image"
            echo
            echo '    docker pull ghcr.io/${{ github.repository }}:'"$VERSION"
            echo
            echo "## The changes"
            echo
            awk -v version="$VERSION" '
              $0 ~ "^## \\[" version "\\]" { found = 1; next }
              found && /^## \\[/ { exit }
              found { print }
            ' CHANGELOG.md
          } > release-notes.md
          cat release-notes.md

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          body_path: release-notes.md
          generate_release_notes: true
          files: |
            CHANGELOG.md
