name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  # The secrets are not available in the condition of a job, so the check of
  # the token of npm lives in the environment of the workflow.
  HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}

jobs:
  publish:
    runs-on: ubuntu-latest
    # The package is published only when the token of npm is in the secrets.
    if: env.HAS_NPM_TOKEN == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: The dependencies
        run: |
          npm ci
          npm ci --prefix packages/vault-mcp

      - name: The build of the package
        run: npm run build --prefix packages/vault-mcp

      - name: Publish
        run: npm publish --prefix packages/vault-mcp --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
