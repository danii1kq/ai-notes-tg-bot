name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    # The secrets are not available in the condition of a job, they live in
    # the environment of the job and the steps look at them.
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: The token of npm
        if: env.NPM_TOKEN == ''
        run: |
          echo "the package is not published, there is no token of npm"

      - name: The dependencies
        if: env.NPM_TOKEN != ''
        run: |
          npm ci
          npm ci --prefix packages/vault-mcp

      - name: The build of the package
        if: env.NPM_TOKEN != ''
        run: npm run build --prefix packages/vault-mcp

      - name: Publish
        if: env.NPM_TOKEN != ''
        run: npm publish --prefix packages/vault-mcp --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
